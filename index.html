<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cahaya Abadi Untuk Ibu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0b1d3a, #1a2a4f, #283e68);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 88%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 10;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lantern-container {
            margin: 20px auto;
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lantern {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ffe399 0%, #ffb347 60%, #ff8c00 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #ffb347, 0 0 60px #ff8c00, 0 0 90px #ffa500;
            animation: pulse 3s infinite ease-in-out, float 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px #ffb347, 0 0 60px #ff8c00; }
            50% { transform: scale(1.1); box-shadow: 0 0 45px #ffe399, 0 0 80px #ff8c00; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #ffe399;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        p.quote {
            font-size: 1.05rem;
            line-height: 1.7;
            font-style: italic;
            color: #e0e8f5;
            margin-bottom: 25px;
        }

        .interactive-note {
            font-size: 0.85rem;
            opacity: 0.75;
            letter-spacing: 0.5px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* Tombol Musik */
        .music-btn {
            background: rgba(255, 227, 153, 0.2);
            border: 1px solid #ffe399;
            color: #ffe399;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .music-btn:hover {
            background: rgba(255, 227, 153, 0.4);
            transform: scale(1.05);
        }

        .floating-message {
            position: absolute;
            color: #ffe399;
            font-size: 0.95rem;
            pointer-events: none;
            animation: floatUp 3.5s forwards ease-out;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            white-space: nowrap;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.9); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="stars" id="starContainer"></div>

    <div class="card">
        <div class="lantern-container">
            <div class="lantern"></div>
        </div>

        <h1>Cahaya Abadi Ibu</h1>

        <p class="quote" id="quoteText">
            "Kasih sayang seorang ibu adalah benang emas yang merajut kenangan indah di dalam jiwa. Beliau tidak benar-benar pergi; beliau menetap di setiap kebaikan yang ku lakukan hari ini."
        </p>

        <div class="interactive-note">
            ✨ Ketuk di mana saja pada layar untuk menerbangkan pesan doa
        </div>

        <br>

        <!-- Elemen Audio & Tombol Pemutar -->
        <audio id="bgMusic" loop>
            <!-- Ganti 'lagu-ibu.mp3' dengan nama file musik lokal Anda atau tautan URL musik langsung -->
            <source src="ibu.mp3" type="audio/mpeg">
            Browser Anda tidak mendukung pemutar audio.
        </audio>
        <button class="music-btn" id="musicToggle">🎵 Putar Musik</button>
    </div>

    <script>
        // Bintang-bintang
        const starContainer = document.getElementById('starContainer');
        const starCount = 70;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            starContainer.appendChild(star);
        }

        // Pesan Doa Saat Mengklik Layar
        const messages = [
            "🤍 Rindu ini adalah bukti cinta yang tak pernah padam",
            "✨ Doa terbaik selalu mengalir untuk Ibu",
            "🌸 Senyuman Ibu adalah hangat yang abadi",
            "🕊️ Semoga kedamaian selalu memeluk Ibu di sana",
            "⭐ Terima kasih atas segala cinta dan pengorbanan Ibu",
            "🌿 Kehangatan kasih Ibu tetap hidup di dalam dada",
            "💫 Suatu hari nanti, kita akan tersenyum bersama lagi"
        ];

        let msgIndex = 0;

        document.addEventListener('click', (e) => {
            // Abaikan jika yang diklik adalah tombol musik agar tidak muncul teks mengambang
            if (e.target.id === 'musicToggle') return;

            const msg = document.createElement('div');
            msg.className = 'floating-message';
            msg.innerText = messages[msgIndex];
            
            msg.style.left = `${e.clientX - 50}px`;
            msg.style.top = `${e.clientY - 20}px`;

            document.body.appendChild(msg);

            msgIndex = (msgIndex + 1) % messages.length;

            setTimeout(() => {
                msg.remove();
            }, 3500);
        });

        // Kontrol Musik
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggle');

        musicBtn.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                musicBtn.innerText = '⏸️ Hentikan Musik';
            } else {
                music.pause();
                musicBtn.innerText = '🎵 Putar Musik';
            }
        });
    </script>
</body>
</html>
